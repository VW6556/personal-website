name: pages

# 不要再用 Deploy from a branch。只發布這兩個紀錄和首頁。
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "linux-audio-sdw-fix.html"
      - "vscode-ime-fix.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 只挑要公開的三個頁面
        run: |
          mkdir -p public
          cp index.html linux-audio-sdw-fix.html vscode-ime-fix.html public/
          find public -type f | sort
          count=$(find public -type f | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::應只有 3 個檔，目前 $count"
            exit 1
          fi
          if find public -type f -name '*.md' | grep -q .; then
            echo "::error::不發布 markdown"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
